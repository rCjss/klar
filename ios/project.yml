# Xcode-Projekt für Klar auf dem iPhone. Wird mit XcodeGen erzeugt (das .xcodeproj liegt nicht im Repository):
#   brew install xcodegen && ../fetch-whisper.sh --ios && xcodegen generate
name: KlarMobile
options:
  bundleIdPrefix: de.felixsiebrasse
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.4.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
targets:
  Klar:
    type: application
    platform: iOS
    sources:
      - path: Klar
      # Gemeinsam mit dem Mac: Modelle, Sprachen, Abschnitte, Download und die lokale Erkennung
      - path: ../Sources/KlarSpeech
        group: Shared
      - path: ../Sources/KlarRecognizers
        group: Shared
    dependencies:
      - framework: ../Vendor/whisper.xcframework
        embed: true
      - framework: ../Vendor/SherpaOnnxC-ios.xcframework
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.felixsiebrasse.klar.mobile
        PRODUCT_NAME: Klar
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_FILE: Klar/Info.plist
        GENERATE_INFOPLIST_FILE: NO
    info:
      path: Klar/Info.plist
      properties:
        CFBundleDisplayName: Klar
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        ITSAppUsesNonExemptEncryption: false
        NSMicrophoneUsageDescription: Klar braucht das Mikrofon, um Diktate und Meetings in Text umzuwandeln.
        # Meetings laufen bei gesperrtem Bildschirm weiter.
        UIBackgroundModes: [audio]
        NSSpeechRecognitionUsageDescription: Für die Erkennung über Apple nutzt Klar die Spracherkennung von iOS.
  KlarTests:
    type: bundle.unit-test
    platform: iOS
    sources: [KlarTests]
    dependencies:
      - target: Klar
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Klar:
    build:
      targets:
        Klar: all
        KlarTests: [test]
    test:
      targets: [KlarTests]
